[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-capture-use-case"
version = "0.1.0"
description = "Tool-grounded decision capture use case built with Flowcept"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flowcept[llm_agent,mongo] @ git+https://github.com/ioannakaragiannifsti/flowcept.git@feature/decision-provenance",
    "pydantic",
    "pyyaml",
]

[project.scripts]
decision-capture-study = "decision_use_case.main:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/decision_use_case"]


